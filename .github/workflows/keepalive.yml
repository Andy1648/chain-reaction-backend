name: keepalive

# Pings /healthz to keep the Render free-tier instance from spinning down.
# Runs 24/7: CrazyGames reviews from Belgium (07:00-16:00 UTC) — exactly the
# gap the old windowed schedule left cold. 24/7 at one instance is ~730
# instance-hours/month, under Render's 750 free-tier cap with ~20h headroom.
# Safe only because this is the sole free service on the account. This is a
# warmer, not a monitor: the job never fails on a bad response.

on:
  schedule:
    # every 5 min, all day
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm /healthz
        run: >-
          curl -sS -o /dev/null -w "%{http_code} %{time_total}\n"
          --max-time 60
          https://chain-reaction-backend-i6kx.onrender.com/healthz
